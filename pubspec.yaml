name: himig
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  async: ^2.13.1
  audio_metadata_reader: ^1.5.0
  audio_service: ^0.18.18
  cached_network_image: ^4.0.2
  collection: ^1.19.1
  cupertino_icons: ^2.0.0
  crypto: ^3.0.7
  dio: ^5.9.2
  file_picker: ^13.1.0
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  package_info_plus: ^10.2.1 # conflict with file_picker
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.3
  yaml: ^3.1.4
  marquee: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/locales/app/
    - lib/locales/error/

analyzer:
  enable-experiment:
    - private-named-parameters
